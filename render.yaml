services:
  - type: web
    name: aerodl-drive-worker
    runtime: docker
    plan: free
    dockerfilePath: ./cloud-downloader/Dockerfile
    dockerContext: ./cloud-downloader
    healthCheckPath: /health
    envVars:
      - key: GITHUB_REPO
        value: a0527198150-del/AeroDL
      - key: GITHUB_ALLOWED_USER
        value: a0527198150-del
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DRIVE_UPLOAD_SECRET
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: GITHUB_NOTIFY_TOKEN
        sync: false
      - key: MAX_FILE_MB
        value: "12"
